# Tool versions for local development (https://mise.jdx.dev). `mise install` sets them up.
# The GitHub Actions workflow reads the same two lines, so CI and local stay in step.
[tools]
ruby = "3.4"   # Jekyll: builds the whole site, including the CSS
node = "24"    # scripts/images.mjs (sharp) and the tests (Playwright); not needed to build the pages
