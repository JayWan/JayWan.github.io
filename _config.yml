
# Syntax highlighting
kramdown:
  input: GFM
  syntax_highlighter: rouge
# Permalinks
permalink:           pretty
future: true

# Setup
# timezone:             # eg. Asia/Hong_Kong
locale:              en_US
name:                LoveStory
title:               221 FOREVER
tagline:             'LOVE'
description:         'An website about THE VERY TWO SOULs.'
url:                 'https://221forever.us'
rss:                 '/feed.xml'
baseurl:             ''
baseurl_posts_img:   '/assets/images/posts/'
baseurl_featured_img: '/assets/images/hero/'
baseurl_featured_thumbnail: '/assets/images/thumbnail/'
baseurl_javascripts: '/assets/javascripts/'
icon:                '/assets/images/icon.png'

author:
  name:              Pikajay
  facebook:          username
  twitter:           username

fb_admins:           your facebook profile id
fb_appid:            your facebook app id

# Server
destination:         ./_site
exclude:             [".editorconfig", ".gitignore", ".jekyll-cache", "gulpfile.mjs", "package.json", "package-lock.json", "node_modules", "README.md"]
port:                7000

defaults:
  -
    scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "default"
