
# Syntax highlighting
kramdown:
  input: GFM
  syntax_highlighter: rouge
# Permalinks
permalink:           pretty
future: true

# Setup
# Letter dates are written without a zone and have always been published as UTC
# (GitHub Actions builds in UTC). Pinning it here makes every machine produce the
# same dates and the same URLs. Changing this value changes the URL of some letters.
timezone:            UTC
locale:              en_US
name:                LoveStory
title:               221 FOREVER
tagline:             'LOVE'
description:         'An website about THE VERY TWO SOULs.'
url:                 'https://221forever.us'
rss:                 '/feed.xml'
baseurl:             ''
baseurl_posts_img:   '/assets/images/posts/'
baseurl_featured_img: '/assets/images/hero/'
baseurl_featured_thumbnail: '/assets/images/thumbnail/'
baseurl_javascripts: '/assets/javascripts/'
icon:                '/assets/images/icon.png'

# The dates the themes count from (they travel to every page inside the data island,
# see _includes/letters-data.html). Quoted on purpose: they are plain "YYYY-MM-DD" strings.
milestones:
  met:               "2015-11-28"
  together:          "2016-02-21"
  married:           "2021-08-12"
  born:              "2016-09-15"   # the day this site was born

author:
  name:              Pikajay
  facebook:          username
  twitter:           username

fb_admins:           your facebook profile id
fb_appid:            your facebook app id

# Styles: assets/css/main.scss + the partials in _scss/ are compiled by Jekyll itself
sass:
  sass_dir:          _scss
  style:             expanded
  sourcemap:         development   # source maps while developing, none in the production build

# Build
destination:         ./_site
exclude:
  - README.md
  - package.json
  - package-lock.json
  - mise.toml
  - scripts
  - tests
  - playwright.config.js
  - test-results
  - playwright-report
  - assets/themes/README.md
  # CSS files the old gulp pipeline left in working copies (git-ignored). If Jekyll
  # copied them, they would overwrite the freshly compiled stylesheet.
  - assets/css/main.css
  - assets/css/main.min.css

# Dev server (`bundle exec jekyll serve`): http://localhost:4301 with live reload
port:                4301
livereload:          true

defaults:
  -
    scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "default"
